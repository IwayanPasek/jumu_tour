---
# ==============================================================================
# cPanel Git Version Control Deployment Configuration
# Proyek: Website Layanan Tour Bali (Jumu Bali Tour MVP)
# Target: $HOME/public_html (Menggunakan .htaccess Redirect Transparan ke public/)
# ==============================================================================

deployment:
  tasks:
    # 1. Tentukan path tujuan deployment ke public_html menggunakan variabel $HOME
    - export DEPLOYPATH=$HOME/public_html/

    # 2. Sinkronkan source code aplikasi secara selektif tanpa menimpa .env production,
    #    tanpa menyalin .git, dan tanpa menyalin node_modules atau folder testing
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/rsync -av --delete --exclude='.git*' --exclude='.env*' --exclude='node_modules' --exclude='tests' --exclude='storage/app/public/*' ./ $DEPLOYPATH

    # 3. Pastikan direktori cache dan logs memiliki hak akses yang aman
    - /bin/chmod -R 755 $DEPLOYPATH/storage
    - /bin/chmod -R 755 $DEPLOYPATH/bootstrap/cache
